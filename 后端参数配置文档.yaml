# ====================================================================
# 后端可调参数清单（甲方/运维交接版）
# --------------------------------------------------------------------
# 用途：本文档为参考清单，汇总后端代码中所有可调整的业务/算法参数。
#       连接配置（数据库地址、MinIO 凭据、vLLM 服务 URL、API token 等）
#       不在此文档中维护，请参见运维提供的 .env 模板。
#
# 结构：
#   预设参数  —— 项目开发组选定的算法/模型/超参，一般不要改动
#   甲方约定参数 —— 接口契约相关，按需求文档约定
#   部署参数  —— 与硬件/运行环境耦合，按实际部署填写
#
# 修改方式：本文件仅为参考清单，实际生效值由代码中的环境变量读取。
#           如需调整，请在 backend/.env 文件中设置对应的环境变量名。
#           （每个参数下方均标注了对应的环境变量名与源文件位置。）
# ====================================================================


# ╔══════════════════════════════════════════════════════════════════╗
# ║                       一、预设参数                                ║
# ║          项目开发组选定的算法/模型/超参，一般不要改动              ║
# ╚══════════════════════════════════════════════════════════════════╝
预设参数:

  # ---------- 对话主模型 ----------
  对话主模型:

    # 控制生成内容的随机性程度。
    # 取值 0 = 完全确定性输出（同样问题给同样答案），取值越高越随机有创意。
    # 0 适合企业问答（要求稳定准确）；调高到 0.7~1.0 适合创意场景。
    采样温度: 0
    # 环境变量名: CHAT_MODEL_TEMPERATURE
    # 代码位置: backend/agent/node.py:226,273

    # 模型单次回答最多生成多少 token（约等于汉字数的 1.5~2 倍）。
    # 超出此值会被截断，回答可能不完整。
    单次最大输出长度: 4096
    # 环境变量名: CHAT_MODEL_MAX_TOKENS
    # 代码位置: backend/agent/node.py:228,275,297

    # 是否启用模型的「思考过程」（extended thinking）。
    # 启用时模型先输出推理过程再给最终答案，回答更准但延迟更高。
    # 关闭可降低延迟约 30%~50%。
    是否启用思考过程: true
    # 环境变量名: 由前端参数 enable_thinking 控制
    # 代码位置: backend/agent/node.py（按请求参数动态控制）


  # ---------- SQL 查询子流程 ----------
  SQL查询子流程:

    # 判断「这个问题是否需要查数据库」的路由模型温度。
    # 用 0 确保分类结果稳定。
    路由判断温度: 0.0
    # 环境变量名: SQL_ROUTE_TEMPERATURE
    # 代码位置: backend/agent/node.py:296

    # 「从所有表中选最相关的几张表」的模型温度。
    # 比 SQL 生成稍高一点，给模型一点判断空间。
    表选择温度: 0.1
    # 环境变量名: DB_LLM_SELECTOR_TEMPERATURE
    # 代码位置: backend/utils/DB_vllm_32B.py:133

    # 表选择模型最多输出多少 token。
    表选择最大输出长度: 1024
    # 环境变量名: DB_LLM_SELECTOR_MAX_TOKENS
    # 代码位置: backend/utils/DB_vllm_32B.py:134

    # 一次查询最多挑选多少张表参与 SQL 生成。
    # 选太多模型上下文压力大；选太少可能漏掉关键表。
    表选择最大数量: 8
    # 代码位置: backend/utils/DB_vllm_32B.py:95（在 SELECT_PROMPT 中硬编码）
    # 注意：此项当前为硬编码，如需调整需修改源码

    # 「生成 SQL 语句」的模型温度。
    # 用 0 保证同样问题生成同样 SQL，便于调试。
    SQL生成温度: 0.0
    # 环境变量名: DB_LLM_GENERATE_TEMPERATURE
    # 代码位置: backend/utils/DB_vllm_32B.py:135

    # SQL 生成模型最多输出多少 token。
    SQL生成最大输出长度: 1024
    # 环境变量名: DB_LLM_GENERATE_MAX_TOKENS
    # 代码位置: backend/utils/DB_vllm_32B.py:136

    # 「SQL 执行报错后请模型修复」的温度。
    SQL修复温度: 0.0
    # 环境变量名: DB_LLM_REVISE_TEMPERATURE
    # 代码位置: backend/utils/DB_vllm_32B.py:137

    # SQL 报错后最多重试修复多少轮。
    # 超过此轮数仍失败则放弃 SQL 查询、转 RAG 兜底。
    SQL修复最大轮数: 4
    # 环境变量名: DB_MAX_REVISE_ROUND
    # 代码位置: backend/utils/DB_vllm_32B.py:37

    # SQL 生成模型是否启用思考过程。
    SQL生成是否启用思考: true
    # 环境变量名: DB_LLM_ENABLE_THINKING
    # 代码位置: backend/utils/DB_vllm_32B.py:138


  # ---------- 知识库（RAG）检索 ----------
  知识库检索:

    # 用于把文本/问题转成向量的模型。
    # 这里用的 bge-small-zh-v1.5 是中文优化版，体积小、CPU 可跑。
    # 如有更高精度需求，可换 bge-large-zh-v1.5（精度更高，但需 GPU）。
    向量化模型: "BAAI/bge-small-zh-v1.5"
    # 环境变量名: RAG_EMBED_MODEL
    # 代码位置: backend/services/milvus_service.py:40

    # 每次检索返回最相关的多少个文档片段。
    # 调大召回内容增多但噪声也增多；调小回答更聚焦但可能漏关键信息。
    检索返回数量: 5
    # 环境变量名: MILVUS_TOP_K
    # 代码位置: backend/services/milvus_service.py:43

    # 相似度阈值，低于此分数的检索结果会被过滤掉。
    # 取值范围 0~1，数值越大越严格。
    相似度阈值: 0.35
    # 环境变量名: MILVUS_SCORE_THRESHOLD
    # 代码位置: backend/services/milvus_service.py:44

    # 知识库文档入库时，每个文本块的最大字符数。
    # 块越大保留上下文越完整，但检索精度下降。
    文本分块大小: 800
    # 环境变量名: MILVUS_CHUNK_SIZE
    # 代码位置: backend/services/milvus_service.py:45

    # 相邻文本块之间的重叠字符数，确保块边界处不丢失语义。
    文本分块重叠: 120
    # 环境变量名: MILVUS_CHUNK_OVERLAP
    # 代码位置: backend/services/milvus_service.py:46

    # 向量索引类型，AUTOINDEX 由 Milvus 自动选择最优算法。
    向量索引类型: "AUTOINDEX"
    # 环境变量名: MILVUS_INDEX_TYPE
    # 代码位置: backend/services/milvus_service.py:39

    # 向量相似度算法。可选 COSINE（余弦相似度）/EUCLIDEAN（欧氏距离）/IP（内积）。
    向量相似度算法: "COSINE"
    # 环境变量名: MILVUS_METRIC_TYPE
    # 代码位置: backend/services/milvus_service.py:40

    # Milvus 一致性级别。Bounded = 有界一致性，读写延迟与新鲜度的折中。
    向量库一致性级别: "Bounded"
    # 环境变量名: MILVUS_CONSISTENCY_LEVEL
    # 代码位置: backend/services/milvus_service.py:38

    # 知识库单个文件解析后最多保留多少字符的纯文本内容。
    # 用于控制超大文档（如几百页 PDF）入库时的截断。
    单文件文本提取上限: 40000
    # 环境变量名: KB_FILE_TEXT_MAX_CHARS
    # 代码位置: backend/services/kb_file_parser.py:17


  # ---------- 历史推荐 ----------
  历史问题推荐:

    # 用于「相似历史问题推荐」的向量化模型。
    # 与知识库分开是因为这里需要稍大模型以支撑短查询的细粒度区分。
    向量化模型: "BAAI/bge-base-zh-v1.5"
    # 环境变量名: QUERY_EMBEDDING_MODEL
    # 代码位置: backend/agent/utils.py:10

    # 预测「用户下一个可能问什么」时，输入给模型的用户消息和 AI 回答的最大字符数。
    历史输入参考字符上限: 500
    # 环境变量名: CHAT_RECOMMENDATION_INPUT_LIMIT
    # 代码位置: backend/app.py:1388


  # ---------- 网络搜索 ----------
  网络搜索:

    # 每次搜索返回最相关的多少个网页结果。
    单次最大返回结果数: 5
    # 环境变量名: RESEARCH_MAX_RESULTS
    # 代码位置: backend/agent/tools/search.py:12

    # 每个搜索结果保留多少字符的网页原文（超出截断）。
    # 太长会占满模型上下文；太短可能漏掉答案。
    单网页原文最大字符数: 4000
    # 环境变量名: RESEARCH_RAW_CONTENT_MAX_CHARS
    # 代码位置: backend/agent/tools/search.py:13

    # 网页摘要生成时是否启用模型思考过程。
    摘要生成是否启用思考: true
    # 环境变量名: RESEARCH_ENABLE_THINKING
    # 代码位置: backend/agent/tools/search.py:42


# ╔══════════════════════════════════════════════════════════════════╗
# ║                     二、甲方约定参数                              ║
# ║          接口契约相关，按需求文档约定                              ║
# ╚══════════════════════════════════════════════════════════════════╝
甲方约定参数:

  # ---------- 对话相关 ----------
  对话:

    # 每次对话携带最近多少轮历史给模型。
    # 6 = 携带最近 6 个问答对。轮数越多上下文越完整但耗 token。
    历史对话最大轮数: 6
    # 环境变量名: CHAT_HISTORY_MAX_ROUNDS
    # 代码位置: backend/app.py:864

    # 用户在对话中上传的文件，其文本内容最多向模型展示多少字符。
    # 超出部分会被截断显示。
    单条对话上传文件文本上限: 12000
    # 环境变量名: CHAT_FILE_TEXT_MAX_CHARS
    # 代码位置: backend/app.py:863

    # 历史对话回看时，已上传文件的摘要展示字符上限。
    历史中上传文件摘要字符上限: 3000
    # 环境变量名: CHAT_FILE_HISTORY_SNIPPET_CHARS
    # 代码位置: backend/app.py:865

    # 每次回答后，给用户推荐多少个「下一步可问」的问题。
    每次推荐问题数量: 3
    # 环境变量名: CHAT_RECOMMENDATION_COUNT
    # 代码位置: backend/app.py:1355,1404


  # ---------- 文件上传 ----------
  文件上传:

    # 后端解析器支持的文件后缀名列表。
    # 列表外的文件会被拒收或无法解析。
    支持的文件格式:
      # 纯文本类
      - .txt
      - .md
      - .csv
      - .json
      - .py
      - .log
      # 文档类
      - .pdf
      - .docx
      - .pptx
      - .xlsx
      - .doc   # 自动转换为 docx
      - .xls   # 自动转换为 xlsx
      - .ppt   # 自动转换为 pptx
      # 图片类（仅对话场景支持，会走视觉模型理解）
      - .png
      - .jpg
      - .jpeg
      - .bmp
      - .gif
    # 代码位置: backend/services/kb_file_parser.py:20,23,221-237
    # 代码位置: backend/app.py:958-996

    # 单个上传文件的最大体积。
    单个文件最大体积_MB: "<代码中未硬编码，由接入层 Nginx/FastAPI 配置控制>"
    # 备注: 后端 Python 层未做大小限制，建议在反向代理层设置 client_max_body_size

    # 单次上传最多文件数量。
    单次最大文件数量: "<代码中未硬编码，由前端业务约定控制>"
    # 备注: 后端未限制，由前端 UI 控制


  # ---------- 模型契约 ----------
  模型契约:

    # 模型可接受的输入上下文长度上限（token 数）。
    # Qwen3 系列默认 32k，可通过 vLLM 启动参数 --max-model-len 调整。
    模型上下文最大长度_token: 32768
    # 代码位置: 由 vLLM 启动命令决定，不在 backend Python 代码中
    # 备注: 实际使用中由 CHAT_HISTORY_MAX_ROUNDS + 文件文本上限共同约束实际占用

    # 模型单次回答最大长度（同上方"预设参数→对话主模型→单次最大输出长度"）。
    模型单次最大输出_token: 4096


# ╔══════════════════════════════════════════════════════════════════╗
# ║                       三、部署参数                                ║
# ║          与硬件/运行环境耦合，按实际部署填写                       ║
# ╚══════════════════════════════════════════════════════════════════╝
部署参数:

  # ---------- 硬件 ----------
  硬件:

    # GPU 型号
    GPU型号: "NVIDIA RTX 4090"

    # 部署使用的 GPU 数量
    GPU数量: "<请填写，例如：2>"

    # 单卡显存容量（GB）
    单卡显存_GB: 24

    # 系统内存
    系统内存_GB: "<请填写>"


  # ---------- vLLM 推理服务 ----------
  vLLM推理服务:

    # 用于推理的模型名称（与上文「对话主模型」对应，由 vLLM 启动时加载）。
    模型名称: "Qwen3.5-27B"
    # 环境变量名: CHAT_MODEL_NAME
    # 代码位置: backend/services/kb_file_parser.py:49, backend/agent/core_agt.py:40

    # vLLM 启动时声明的最大序列长度（决定模型上下文窗口）。
    最大序列长度_token: 32768
    # 备注: 在 vLLM 启动命令的 --max-model-len 参数中设置

    # 张量并行度（一般等于 GPU 数量）。
    张量并行度: "<请按 GPU 数量填，例如：2>"
    # 备注: 在 vLLM 启动命令的 --tensor-parallel-size 中设置

    # 同时处理的最大请求数（vLLM 内部 batch）。
    最大并发请求数: "<请按显存和延迟需求评估，例如：32>"
    # 备注: 在 vLLM 启动命令的 --max-num-seqs 中设置


  # ---------- 计算设备分配 ----------
  计算设备分配:

    # 知识库 embedding 模型运行设备。
    # cpu = 用 CPU 跑（慢但不占显存）；cuda = 用 GPU 跑（快但占显存）。
    向量化模型运行设备: "cpu"
    # 环境变量名: RAG_EMBED_DEVICE
    # 代码位置: backend/services/milvus_service.py:41

    # 向量化模型批量编码的批次大小（越大越快但越占内存/显存）。
    向量化批处理大小: 32
    # 环境变量名: MILVUS_BATCH_SIZE
    # 代码位置: backend/services/milvus_service.py:42


  # ---------- 超时设置 ----------
  超时设置:

    # 模型 API 单次调用的最大等待时间（秒）。
    # 模型推理慢/请求大时可调大；网络稳定可调小避免长时间挂起。
    模型调用超时_秒: 120
    # 环境变量名: CHAT_MODEL_TIMEOUT
    # 代码位置: backend/agent/node.py:229,276,298

    # 数据库 TCP 连接建立的超时时间（秒）。
    # 5 秒内无响应判定数据库不可用。
    数据库连接超时_秒: 5
    # 代码位置: backend/services/db_registry.py:27


  # ---------- 流式响应（影响打字机效果体感） ----------
  流式响应:

    # 正文输出每次推流的字符数粒度（默认每次 1 字符 = 逐字打字效果）。
    正文推流字符粒度: 1
    # 环境变量名: CHAT_STREAM_DELTA_CHARS
    # 代码位置: backend/app.py:1552

    # 正文推流每个字符之间的延迟（毫秒）。
    # 调大 → 打字机更慢，体验更"思考";调小 → 输出更快但体感"刷屏"。
    正文推流字符间延迟_毫秒: 15
    # 环境变量名: CHAT_STREAM_CHAR_DELAY_MS
    # 代码位置: backend/app.py:1560,2133,2151

    # 思考过程输出每次推流的字符粒度（默认每次 48 字符 = 块状输出）。
    # 思考过程内容较多，采用块状输出更高效。
    思考推流字符粒度: 48
    # 环境变量名: CHAT_THINKING_CHUNK_SIZE
    # 代码位置: backend/app.py:1856


  # ---------- 业务并发 ----------
  业务并发:

    # FastAPI 后端启动时的 worker 数量。
    # 影响同时能处理的 HTTP 请求数；与硬件 CPU 核数和内存挂钩。
    后端worker数量: "<请按部署填，例如：4>"
    # 备注: 在 uvicorn 启动命令的 --workers 参数中设置

    # 服务端最大同时对话数（业务层估算）。
    # 由 vLLM 最大并发请求数 × 平均 SQL/RAG 耗时综合决定。
    服务端最大同时对话数: "<请按 vLLM 配置估算>"


# ====================================================================
# 备注与说明
# --------------------------------------------------------------------
# 1. 本文档为参考清单，修改实际生效值请通过 backend/.env 文件设置对应
#    环境变量；某些硬编码项（如「SQL 表选择最大数量」）需要修改源代码。
#
# 2. 连接配置（数据库地址/MinIO 凭据/vLLM URL/API token 等）出于安全考虑
#    不写入本文档；请参考运维提供的 .env 模板。
#
# 3. 与本项目并行的知识图谱模块（graph 目录）有独立的参数文档，详见
#    项目根目录的「知识图谱参数配置文档.md」。
#
# 4. 文档与代码可能存在更新滞后；以代码中的实际默认值为准。
#    维护人请在修改代码默认值时同步更新本文档对应条目。
# ====================================================================
